<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YouTube Meeting Checklist</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#1c2530;--muted:#5d6b7a;--line:#d5dce3;--accent:#1f6f5c;--accent-ink:#fff;--done:#e4f2ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191f;--card:#1d242c;--ink:#e8edf2;--muted:#9aa8b6;--line:#33404d;--accent:#4fb59c;--accent-ink:#0b1a16;--done:#1d3a33}}
:root[data-theme="dark"]{--bg:#14191f;--card:#1d242c;--ink:#e8edf2;--muted:#9aa8b6;--line:#33404d;--accent:#4fb59c;--accent-ink:#0b1a16;--done:#1d3a33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:28px 16px}
main{width:100%;max-width:1200px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.logo{height:44px;width:auto;background:#fff;border-radius:8px;padding:4px 10px;border:1px solid var(--line)}
h1{margin:0;font-size:1.6rem;font-weight:700}
h2{margin:0;font-size:1.15rem}
.theme{margin-left:auto;width:44px;height:44px;padding:0;font-size:1.3rem;line-height:1;color:var(--ink)}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
.panelbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.controls{display:grid;grid-template-columns:minmax(150px,220px) minmax(240px,420px);gap:20px;align-items:end}
label.f{display:grid;gap:6px;font-size:.9rem;color:var(--muted)}
input[type=date]{font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--line);padding:6px 2px;outline:none;border-radius:0}
input[type=date]:focus{border-bottom-color:var(--accent)}
details{position:relative}
summary{font:inherit;color:var(--ink);border-bottom:2px solid var(--line);padding:6px 2px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"\25BE";color:var(--muted)}
details[open] summary{border-bottom-color:var(--accent)}
.menu{position:absolute;z-index:5;top:100%;left:0;right:0;max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;margin-top:4px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.menu label{display:flex;align-items:center;gap:10px;padding:8px;border-radius:6px;cursor:pointer}
.menu label:hover{background:var(--done)}
.menu label.off{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{background:var(--done);border:1px solid var(--accent);border-radius:999px;padding:3px 12px;font-size:.9rem}
.hint{color:var(--muted);margin:0;font-size:.95rem}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.cnt{margin:2px 0 14px;color:var(--muted);font-size:.9rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;gap:8px;align-items:center}
li label{flex:1;display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:1.02rem;transition:background .15s}
li label:hover{border-color:var(--accent)}
li.done label{background:var(--done);border-color:var(--accent)}
li.done span{text-decoration:line-through;color:var(--muted)}
.badge{margin-left:auto;font-weight:700;color:var(--accent);font-size:1.05rem}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;margin:0}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 18px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.minus{padding:9px 13px;font-size:1.1rem;line-height:1}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#msg{color:var(--muted)}
.hist{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.del{padding:4px 10px;font-weight:500}
@media (max-width:560px){.controls{grid-template-columns:1fr}}
</style>
</head>

<script>
(function(){
var ITEMS=["Exam Information","Strategy","Profile","IM","Course","Comparison","RTI","UPSC","B.Com"];
var EXAMS=["RBI Grade B","RBI Grade A","NABARD Grade A","SEBI Grade A","JAIIB","CAIIB","UPSC EPFO","UPSC CSAT","SBI PO","SBI Clerk","RRB PO","RRB Clerk","IBPS PO","IBPS Clerk","FCI AG 3","IRDAI Grade A","IFSCA Grade A","SIDBI Grade A","SIDBI Grade B","PFRDA Grade A","ESIC DD","NPS Grade A","NPS Grade B","UPSC LEO","IBBI Grade A","UPSC ALC","IBBI","Bank Exams"];
var MAX=5,KEY="meeting-checklist-v2",OLD="meeting-checklist-v1",HKEY="meeting-history-v1";
function $(id){return document.getElementById(id);}
function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e;}
function num(v){return v===true?1:(typeof v==="number"&&v>0?Math.floor(v):0);}
var state={date:"",exams:[],data:{}},hist=[];
try{var s=localStorage.getItem(KEY);
if(s){var p=JSON.parse(s);if(p&&typeof p==="object"){state.date=p.date||"";state.exams=Array.isArray(p.exams)?p.exams.slice(0,MAX):[];state.data=p.data||{};}}
else{var o=localStorage.getItem(OLD);if(o){var q=JSON.parse(o);if(q&&typeof q==="object"){state.date=q.date||"";if(q.exam){state.exams=[q.exam];state.data[q.exam]=q.checked||{};}}}}
}catch(e){}
try{var h=localStorage.getItem(HKEY);if(h){var hp=JSON.parse(h);if(Array.isArray(hp))hist=hp;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function saveH(){try{localStorage.setItem(HKEY,JSON.stringify(hist));}catch(e){}}
function examList(){var l=EXAMS.slice();state.exams.forEach(function(x){if(l.indexOf(x)<0)l.push(x);});return l;}
function renderMenu(){
var menu=$("menu");menu.innerHTML="";var full=state.exams.length>=MAX;
examList().forEach(function(name){
var on=state.exams.indexOf(name)>=0;
var lab=el("label",(!on&&full)?"off":"");var cb=el("input");cb.type="checkbox";cb.checked=on;cb.disabled=!on&&full;
var sp=el("span");sp.textContent=name;lab.appendChild(cb);lab.appendChild(sp);
cb.addEventListener("change",function(){
var sel=state.exams.slice();var i=sel.indexOf(name);
if(cb.checked&&i<0&&sel.length<MAX)sel.push(name);else if(!cb.checked&&i>=0)sel.splice(i,1);
var order=examList();state.exams=order.filter(function(x){return sel.indexOf(x)>=0;});
save();renderMenu();renderChips();renderCards();
});
menu.appendChild(lab);
});
$("sum").textContent=state.exams.length?state.exams.length+" of "+MAX+" selected":"Select exams";
}
function renderChips(){
var c=$("chips");c.innerHTML="";
if(!state.exams.length){var p=el("p","hint");p.textContent="Pick one or more exams to see a checklist for each.";c.appendChild(p);return;}
state.exams.forEach(function(x){var s=el("span","chip");s.textContent=x;c.appendChild(s);});
}
function buildCard(exam){
var d=state.data[exam]||(state.data[exam]={});
var card=el("section","card"),head=el("h2"),cnt=el("p","cnt"),ul=el("ul");
head.textContent=exam;card.appendChild(head);card.appendChild(cnt);card.appendChild(ul);
function total(){var n=0;ITEMS.forEach(function(i){if(num(d[i])>0)n++;});cnt.textContent=n+" of "+ITEMS.length+" done";}
ITEMS.forEach(function(name){
var li=el("li"),lab=el("label"),cb=el("input"),sp=el("span"),badge=el("b","badge"),minus=el("button","alt minus");
cb.type="checkbox";sp.textContent=name;minus.type="button";minus.textContent="−";
minus.setAttribute("aria-label","Reduce count for "+name+" in "+exam);
function paint(){var c=num(d[name]);cb.checked=c>0;li.className=c>0?"done":"";badge.textContent=c>0?"×"+c:"";minus.style.visibility=c>0?"visible":"hidden";}
cb.addEventListener("click",function(){d[name]=num(d[name])+1;paint();save();total();});
minus.addEventListener("click",function(){d[name]=Math.max(0,num(d[name])-1);paint();save();total();});
paint();lab.appendChild(cb);lab.appendChild(sp);lab.appendChild(badge);li.appendChild(lab);li.appendChild(minus);ul.appendChild(li);
});
total();return card;
}
function renderCards(){var c=$("cards");c.innerHTML="";state.exams.forEach(function(x){c.appendChild(buildCard(x));});}
function renderHist(){
var he=$("hist");he.innerHTML="";
if(!hist.length){var p=el("p","hint");p.textContent="No saved meetings yet. Tick items and press Save today.";he.appendChild(p);return;}
var t=el("table"),hd=el("tr");
["Date","Exam","Done",""].forEach(function(x){var th=el("th");th.textContent=x;hd.appendChild(th);});t.appendChild(hd);
hist.forEach(function(e,idx){
var tr=el("tr");
var vals=[e.date||"No date",e.exam||"-",e.done.length+"/"+ITEMS.length+(e.done.length?": "+e.done.map(function(n){var c=e.counts&&e.counts[n];return c>1?n+" ×"+c:n;}).join(", "):"")];
vals.forEach(function(v){var td=el("td");td.textContent=v;tr.appendChild(td);});
var td=el("td"),b=el("button","alt del");b.type="button";b.textContent="Delete";
b.addEventListener("click",function(){if(!confirm("Delete this saved meeting?"))return;hist.splice(idx,1);saveH();renderHist();});
td.appendChild(b);tr.appendChild(td);t.appendChild(tr);
});
he.appendChild(t);
}
function renderAll(){$("date").value=state.date;renderMenu();renderChips();renderCards();}
$("date").addEventListener("input",function(){state.date=$("date").value;save();});
$("savebtn").addEventListener("click",function(){
if(!state.exams.length){$("msg").textContent="Select at least one exam first.";return;}
if(!state.date){var d=new Date();state.date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");$("date").value=state.date;save();}
state.exams.forEach(function(exam){
var d=state.data[exam]||{};
var done=ITEMS.filter(function(i){return num(d[i])>0;});
var cnt={};done.forEach(function(i){cnt[i]=num(d[i]);});
var e={date:state.date,exam:exam,done:done,counts:cnt};
var f=-1;hist.forEach(function(x,i){if(x.date===e.date&&x.exam===e.exam)f=i;});
if(f>=0)hist[f]=e;else hist.push(e);
});
hist.sort(function(a,b){return (b.date||"").localeCompare(a.date||"");});
saveH();renderHist();$("msg").textContent="Saved "+state.exams.length+" exam(s) for "+state.date+".";
});
$("reset").addEventListener("click",function(){
if(!confirm("Clear all ticks, date and selected exams?"))return;
state={date:"",exams:[],data:{}};save();$("msg").textContent="";renderAll();
});
document.addEventListener("click",function(ev){var dd=$("dd");if(dd.open&&!dd.contains(ev.target))dd.open=false;});
var TKEY="meeting-theme",root=document.documentElement,mq=window.matchMedia("(prefers-color-scheme: dark)");
function isDark(){var t=root.getAttribute("data-theme");return t?t==="dark":mq.matches;}
function icon(){var b=$("theme");b.textContent=isDark()?"☀️":"🌙";var l=isDark()?"Switch to light theme":"Switch to dark theme";b.setAttribute("aria-label",l);b.title=l;}
try{var tv=localStorage.getItem(TKEY);if(tv==="dark"||tv==="light")root.setAttribute("data-theme",tv);}catch(e){}
$("theme").addEventListener("click",function(){var n=isDark()?"light":"dark";root.setAttribute("data-theme",n);try{localStorage.setItem(TKEY,n);}catch(e){}icon();});
if(mq.addEventListener)mq.addEventListener("change",icon);
icon();
renderHist();renderAll();
})();
</script>
</body>
</html>
